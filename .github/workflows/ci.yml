name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main # en main el CI se ejecuta desde deploy.yml, antes de construir la imagen
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # usa la versión de "packageManager" en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (sin --fix; las infracciones heredadas están en eslint-suppressions.json)
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
